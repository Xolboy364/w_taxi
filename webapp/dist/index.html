<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F5F7FB">
<title>W-Taxi</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#F5F7FB;color:#0B2A5B;display:flex;justify-content:center;align-items:center;overscroll-behavior:none;user-select:none}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
:root{--navy:#0B2A5B;--navy-2:#1A3B7A;--navy-soft:rgba(11,42,91,.10);--green:#22A06B;--green-soft:rgba(34,160,107,.12);--amber:#E8A500;--amber-soft:rgba(232,165,0,.12);--rust:#C2560B;--red:#E5484D;--red-soft:rgba(229,72,77,.12);--silver:#A8B2BF;--silver-2:#DDE3EA;--bg:#F5F7FB;--ink:#0B2A5B;--muted:#7C8AA0;--hair:rgba(11,42,91,.08)}
.phone{position:relative;width:100%;max-width:420px;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
@media(min-width:640px){.phone{height:880px;border-radius:44px;box-shadow:0 60px 140px -30px rgba(11,42,91,.28),0 0 0 1px rgba(11,42,91,.06)}}
.ic{display:inline-block;flex-shrink:0;width:1em;height:1em;color:currentColor;vertical-align:middle}
.ic use{pointer-events:none}
.map{position:absolute;inset:0;z-index:0;transition:opacity .3s}
.map svg{width:100%;height:100%;display:block}
.bgpanel{position:absolute;inset:0;z-index:0;background:linear-gradient(160deg,#0E1B33 0%,#0B2A5B 55%,#123661 100%);display:none}
.bgpanel::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:28px 28px;opacity:.5}
.glow{position:absolute;border-radius:9999px;filter:blur(100px);pointer-events:none}
.street-label{font-size:6.5px;font-weight:600;fill:#9AA7B8;letter-spacing:.08em;text-transform:uppercase;paint-order:stroke;stroke:#fff;stroke-width:1.5px}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes sheetIn{from{transform:translateY(80px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes sweep{0%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@keyframes popIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes modalIn{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.fade-up{animation:fadeUp .3s cubic-bezier(.22,.61,.36,1) both}
.sheet-in{animation:sheetIn .5s cubic-bezier(.22,.61,.36,1) both}
.pop{animation:popIn .4s cubic-bezier(.34,1.56,.64,1) both}
.sweep{animation:sweep 2.6s ease-in-out infinite}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:9999px;animation:spin .7s linear infinite}
.topbar{position:relative;z-index:20;padding:22px 20px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.brand{display:flex;align-items:center;gap:9px;padding:8px 14px;border-radius:9999px;background:rgba(255,255,255,.94);backdrop-filter:blur(20px);border:1px solid var(--hair);box-shadow:0 4px 16px rgba(11,42,91,.06)}
.brand-w{width:17px;height:17px;color:var(--navy)}
.brand-txt{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--navy)}
.brand-txt .dash{color:var(--silver);margin:0 1px;font-weight:600}
.brand-tag{font-size:9.5px;color:var(--silver);font-weight:600}
.topbar.dark .brand{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.14)}
.topbar.dark .brand-w,.topbar.dark .brand-txt{color:#fff}
.topbar.dark .brand-tag{color:rgba(255,255,255,.55)}
.avatar{width:38px;height:38px;border-radius:9999px;background:rgba(255,255,255,.94);border:1px solid var(--hair);box-shadow:0 4px 16px rgba(11,42,91,.06);display:flex;align-items:center;justify-content:center;color:var(--navy);overflow:hidden}
.avatar .ic{width:17px;height:17px}
.crown-badge{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9999px;background:rgba(232,165,0,.18);border:1px solid rgba(232,165,0,.35);color:var(--amber);font-size:10px;font-weight:800}
.crown-badge .ic{width:12px;height:12px}
.sheet{position:relative;z-index:20;margin-top:auto;background:linear-gradient(180deg,rgba(255,255,255,.96) 0%,rgba(255,255,255,.99) 100%);backdrop-filter:blur(30px);border-top:1px solid var(--hair);border-radius:32px 32px 0 0;padding:12px 18px 0;box-shadow:0 -20px 60px -20px rgba(11,42,91,.14);flex:1;display:flex;flex-direction:column;min-height:0}
.handle{width:38px;height:4px;border-radius:9999px;background:rgba(11,42,91,.12);margin:0 auto 12px;flex-shrink:0}
.scroll-area{overflow-y:auto;flex:1;min-height:0;padding-bottom:14px}
.scroll-area::-webkit-scrollbar{display:none}
.login-banner{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--amber-soft);border:1px solid rgba(232,165,0,.28);margin-bottom:12px;flex-shrink:0}
.login-banner .ic{width:15px;height:15px;color:var(--amber);flex-shrink:0}
.login-banner .txt{flex:1;font-size:10.5px;font-weight:700;color:#9A6B00;line-height:1.4}
.pill-tabs{display:flex;gap:7px;overflow-x:auto;margin-bottom:14px;flex-shrink:0}
.pill-tabs::-webkit-scrollbar{display:none}
.ptab{flex-shrink:0;padding:9px 15px;border-radius:9999px;background:#F1F5F9;border:1px solid var(--hair);font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .2s;white-space:nowrap}
.ptab.active{background:linear-gradient(135deg,var(--navy),var(--navy-2));color:#fff;border-color:transparent}
.mode-toggle{display:flex;background:#EEF2F8;border-radius:16px;padding:4px;position:relative;margin-bottom:14px;flex-shrink:0}
.mode-bg{position:absolute;top:4px;bottom:4px;width:calc(50% - 4px);border-radius:12px;background:#fff;box-shadow:0 4px 14px rgba(11,42,91,.12);transition:transform .3s cubic-bezier(.22,.61,.36,1)}
.mode-toggle.b .mode-bg{transform:translateX(calc(100% + 4px))}
.mode-opt{flex:1;position:relative;z-index:1;padding:11px 8px;text-align:center;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer;transition:color .3s}
.mode-opt.sel{color:var(--ink)}
.mode-opt .dot{width:6px;height:6px;border-radius:9999px;background:currentColor;display:inline-block;margin-right:6px}
.mode-opt.sel .dot{background:var(--green)}
.chip-row{display:flex;gap:7px;overflow-x:auto;margin-bottom:14px;flex-wrap:wrap}
.chip-row::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:9px 13px;border-radius:9999px;background:#F1F5F9;border:1px solid var(--hair);font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .2s;white-space:nowrap;display:flex;align-items:center;gap:5px}
.chip.active{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--navy),var(--navy-2))}
.chip .dot{width:6px;height:6px;border-radius:9999px}
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.cat-cell{border-radius:16px;padding:12px 6px;background:#F8FAFC;border:1px solid var(--hair);display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:all .2s}
.cat-cell.active{background:linear-gradient(135deg,var(--navy),var(--navy-2));border-color:transparent}
.cat-ic{width:24px;height:24px;border-radius:9px;background:var(--navy-soft);color:var(--navy);display:flex;align-items:center;justify-content:center;transition:all .2s}
.cat-cell.active .cat-ic{background:rgba(255,255,255,.18);color:#fff}
.cat-ic .ic{width:13px;height:13px}
.cat-label{font-size:9px;font-weight:700;color:var(--muted);text-align:center;line-height:1.2}
.cat-cell.active .cat-label{color:#fff}
.field{margin-bottom:13px}
.field-label{font-size:10.5px;font-weight:700;color:var(--muted);margin-bottom:7px;display:block}
.field-input,.field-select,textarea.field-input{width:100%;padding:13px 14px;border-radius:14px;background:#F8FAFC;border:1px solid var(--hair);color:var(--ink);font-size:13px;font-weight:600;font-family:inherit;outline:none}
textarea.field-input{resize:none;height:64px}
.field-input::placeholder{color:var(--silver);font-weight:500}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.route-box{border-radius:22px;padding:15px;background:#F8FAFC;border:1px solid var(--hair);margin-bottom:14px}
.route-inner{display:flex;gap:11px}
.route-rail{display:flex;flex-direction:column;align-items:center;padding-top:6px}
.dot-a{width:8px;height:8px;border-radius:9999px;background:var(--navy);box-shadow:0 0 0 3px var(--navy-soft)}
.rail{width:1px;height:26px;margin:4px 0;background:linear-gradient(180deg,rgba(11,42,91,.4),rgba(34,160,107,.4))}
.dot-b{width:8px;height:8px;border-radius:9999px;background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.route-fields{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.route-sep{height:1px;background:var(--hair)}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.stat-box{background:#F8FAFC;border:1px solid var(--hair);border-radius:16px;padding:12px 8px;text-align:center}
.stat-num{font-size:16px;font-weight:800;color:var(--ink);font-family:'JetBrains Mono',monospace}
.stat-label{font-size:8.5px;color:var(--muted);margin-top:3px;font-weight:700}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;margin-top:16px}
.sec-head:first-child{margin-top:0}
.sec-title{font-size:12px;font-weight:800;color:var(--ink)}
.sec-action{font-size:11px;font-weight:700;color:var(--navy-2);cursor:pointer}
.card-row{display:flex;align-items:center;gap:11px;padding:12px;border-radius:18px;background:#F8FAFC;border:1px solid var(--hair);margin-bottom:8px}
.card-row .ic-box{flex-shrink:0;width:38px;height:38px;border-radius:13px;display:flex;align-items:center;justify-content:center}
.card-row .ic-box .ic{width:16px;height:16px}
.card-row .tx{flex:1;min-width:0}
.card-row .nm{font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-row .sub{font-size:10.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-row .side{flex-shrink:0;text-align:right}
.card-row .side .num{font-size:13px;font-weight:800;color:var(--ink);font-family:'JetBrains Mono',monospace}
.card-row .side .unit{font-size:9px;color:var(--silver);font-weight:700}
.empty-note{text-align:center;padding:26px 10px;color:var(--silver);font-size:11.5px;font-weight:600}
.profile-card{border-radius:22px;padding:16px;margin-bottom:14px;background:linear-gradient(135deg,rgba(11,42,91,.08),rgba(11,42,91,.02));border:1px solid rgba(11,42,91,.18)}
.profile-row{display:flex;align-items:center;gap:12px}
.profile-av{position:relative;flex-shrink:0;width:50px;height:50px;border-radius:17px;background:linear-gradient(135deg,var(--navy),var(--navy-2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px;font-weight:800}
.profile-crown{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:9999px;background:var(--amber);border:2px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff}
.profile-crown .ic{width:10px;height:10px}
.profile-info{flex:1;min-width:0}
.profile-name{font-size:13.5px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-sub{font-size:11px;color:var(--navy-2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status-toggle{margin-top:14px;display:flex;background:#EEF2F8;border-radius:16px;padding:4px;position:relative}
.status-toggle-bg{position:absolute;top:4px;bottom:4px;width:calc(50% - 4px);border-radius:12px;background:#fff;box-shadow:0 4px 14px rgba(11,42,91,.12);transition:transform .3s cubic-bezier(.22,.61,.36,1)}
.status-toggle.on .status-toggle-bg{transform:translateX(calc(100% + 4px))}
.status-opt{flex:1;position:relative;z-index:1;padding:11px 8px;text-align:center;font-size:11.5px;font-weight:700;color:var(--muted);cursor:pointer}
.status-opt.sel{color:var(--ink)}
.sub-card{border-radius:20px;padding:15px;background:linear-gradient(135deg,rgba(232,165,0,.10),rgba(232,165,0,.02));border:1px solid rgba(232,165,0,.28)}
.sub-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sub-title{font-size:12px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:6px}
.sub-title .ic{width:13px;height:13px;color:var(--amber)}
.badge{font-size:9.5px;font-weight:800;padding:4px 9px;border-radius:9999px}
.badge.on{background:var(--green-soft);color:var(--green)}
.badge.off{background:var(--red-soft);color:var(--red)}
.ctrl-card{border-radius:20px;padding:15px;background:#F8FAFC;border:1px solid var(--hair);margin-bottom:10px}
.ctrl-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ctrl-title{font-size:12.5px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:7px}
.ctrl-ic{width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ctrl-ic .ic{width:12px;height:12px}
.ctrl-desc{font-size:10.5px;color:var(--muted);line-height:1.5;margin:8px 0 12px}
.btn-sm{width:100%;padding:11px;border-radius:12px;border:none;font-family:inherit;font-size:11.5px;font-weight:700;cursor:pointer;transition:transform .12s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-sm:active{transform:scale(.97)}
.btn-sm.ghost{background:#EEF2F8;color:var(--ink)}
.btn-sm.danger{background:var(--red-soft);color:var(--red)}
.btn-sm .ic{width:12px;height:12px}
.rm-btn{flex-shrink:0;width:26px;height:26px;border-radius:9999px;background:var(--red-soft);color:var(--red);display:flex;align-items:center;justify-content:center;cursor:pointer}
.rm-btn .ic{width:12px;height:12px}
.log-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--hair)}
.log-item:last-child{border-bottom:none}
.log-dot{width:7px;height:7px;border-radius:9999px;margin-top:5px;flex-shrink:0}
.log-tx{flex:1;min-width:0}
.log-action{font-size:11px;font-weight:700;color:var(--ink)}
.log-detail{font-size:10px;color:var(--muted);margin-top:2px}
.log-time{font-size:8.5px;color:var(--silver);margin-top:3px;font-family:'JetBrains Mono',monospace}
.loc-pill{display:flex;align-items:center;gap:8px;padding:12px 14px;border-radius:14px;background:var(--green-soft);border:1px solid rgba(34,160,107,.28);color:var(--green);font-size:12px;font-weight:700;cursor:pointer}
.loc-pill .ic{width:14px;height:14px}
.price-band{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-radius:16px;background:linear-gradient(135deg,rgba(11,42,91,.06),rgba(11,42,91,.02));border:1px solid var(--hair);margin:4px 0 14px}
.price-band .lbl{font-size:10.5px;color:var(--muted);font-weight:700}
.price-band .val{font-size:16px;font-weight:800;color:var(--ink);font-family:'JetBrains Mono',monospace}
.cta{position:relative;width:100%;padding:14px;border-radius:16px;background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);border:none;color:#fff;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;overflow:hidden;transition:transform .12s;box-shadow:0 14px 40px -10px rgba(11,42,91,.5);display:flex;align-items:center;justify-content:center;gap:8px}
.cta:active{transform:scale(.975)}
.cta .ic{width:14px;height:14px}
.cta::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);animation:sweep 2.6s ease-in-out infinite}
.cta:disabled{opacity:.45;pointer-events:none}
.cta.red{background:linear-gradient(135deg,#E5484D,#C23138);box-shadow:0 14px 40px -10px rgba(229,72,77,.4)}
.pending-card{border-radius:20px;padding:16px;background:linear-gradient(135deg,rgba(232,165,0,.10),rgba(232,165,0,.02));border:1px solid rgba(232,165,0,.28);text-align:center}
.pending-ic{width:42px;height:42px;border-radius:9999px;background:var(--amber-soft);color:var(--amber);display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.pending-title{font-size:13px;font-weight:800;color:var(--ink)}
.pending-desc{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.5}
.err-msg{font-size:11.5px;color:var(--red);font-weight:700;margin:6px 0;text-align:center}
.bottom-nav{position:relative;z-index:25;flex-shrink:0;background:rgba(255,255,255,.98);border-top:1px solid var(--hair);padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:space-around}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 10px;background:transparent;border:none;cursor:pointer;font-family:inherit;border-radius:14px;transition:background .2s}
.nav-item.active{background:var(--navy-soft)}
.nav-item .ic{width:19px;height:19px;color:var(--silver);transition:color .2s}
.nav-item.active .ic{color:var(--navy)}
.nav-label{font-size:9px;font-weight:700;color:var(--silver);transition:color .2s}
.nav-item.active .nav-label{color:var(--ink)}
.modal-overlay{position:absolute;inset:0;z-index:50;background:rgba(11,20,35,.55);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex}
.modal-box{width:100%;background:#fff;border-radius:28px 28px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));animation:modalIn .35s cubic-bezier(.22,.61,.36,1)}
.modal-ic{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center;margin-bottom:13px}
.modal-ic .ic{width:20px;height:20px}
.modal-title{font-size:14.5px;font-weight:800;color:var(--ink);margin-bottom:6px}
.modal-desc{font-size:11.5px;color:var(--muted);line-height:1.55;margin-bottom:18px}
.modal-actions{display:flex;gap:10px}
.modal-actions button{flex:1}
.toast{position:absolute;left:20px;right:20px;bottom:86px;z-index:60;background:var(--ink);color:#fff;padding:13px 16px;border-radius:14px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:9px;box-shadow:0 16px 40px -10px rgba(11,42,91,.4);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;transform:translateY(8px)}
.toast.show{opacity:1;transform:translateY(0)}
.toast .ic{width:15px;height:15px;color:var(--green);flex-shrink:0}
.tg-badge{position:fixed;bottom:8px;left:8px;z-index:100;font-size:9px;font-family:'JetBrains Mono',monospace;color:var(--silver);background:rgba(255,255,255,.6);padding:3px 7px;border-radius:6px;opacity:.7;pointer-events:none}
#tgLoginWrap{display:flex;justify-content:center;padding:8px 0}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<symbol id="i-w" viewBox="0 0 24 24"><path d="M3 6 L8 18 L12 10 L16 18 L21 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4.5 20 C4.5 16.2 8 14 12 14 C16 14 19.5 16.2 19.5 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>

/* ============================================================= */
/* API CLIENT                                                      */
/* ============================================================= */
function authHeaders(){
  if(inTelegram) return {"X-Init-Data": tg.initData};
  const t = localStorage.getItem("wtaxi_session");
  return t ? {"X-Session-Token": t} : {};
}
async function api(path, options={}){
  const res = await fetch(path, {...options, headers:{"Content-Type":"application/json",...authHeaders(),...(options.headers||{})}});
  if(!res.ok){ let e={}; try{ e = await res.json(); }catch(_){} const err = new Error(friendlyError(e.error)); err.code = e.error; throw err; }
  if(res.status===204) return null;
  return res.json();
}
const apiGet = p => api(p);
const apiPost = (p,b) => api(p,{method:"POST",body:JSON.stringify(b||{})});
const apiDelete = p => api(p,{method:"DELETE"});

function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function initials(name){ return (name||"?").split(" ").map(p=>p[0]).slice(0,2).join("").toUpperCase(); }

function confirmAction({icon, iconBg, iconColor, title, desc, danger, onConfirm}){
  WT.warning();
  $('modalIc').style.background = iconBg; $('modalIc').style.color = iconColor;
  $('modalIc').innerHTML = '<svg class="ic" viewBox="0 0 24 24"><use href="#'+icon+'"/></svg>';
  $('modalTitle').textContent = title; $('modalDesc').textContent = desc;
  $('modalConfirm').className = danger ? 'cta red' : 'cta';
  $('modalOverlay').classList.add('show');
  const ok = async ()=>{ $('modalOverlay').classList.remove('show'); cleanup(); await onConfirm(); };
  const no = ()=>{ $('modalOverlay').classList.remove('show'); cleanup(); };
  function cleanup(){ $('modalConfirm').removeEventListener('click', ok); $('modalCancel').removeEventListener('click', no); }
  $('modalConfirm').addEventListener('click', ok);
  $('modalCancel').addEventListener('click', no);
}

  if(needsLogin && !$('tgLoginWrap').dataset.mounted){
    $('tgLoginWrap').dataset.mounted = '1';
    window.onTelegramAuth = async (user)=>{
      try{ const res = await apiPost('/api/auth/login-widget', user); localStorage.setItem('wtaxi_session', res.token); await loadMe(); toast('Xush kelibsiz!'); }
      catch(e){ toast(friendlyError(e.code)); }
    };
    const s = document.createElement('script');
    s.src = "https://telegram.org/js/telegram-widget.js?22"; s.async = true;
    s.setAttribute('data-telegram-login', BOT_USERNAME); s.setAttribute('data-size','medium');
    s.setAttribute('data-radius','12'); s.setAttribute('data-onauth','onTelegramAuth(user)'); s.setAttribute('data-request-access','write');
    $('tgLoginWrap').appendChild(s);
  }
}
function requireAuth(){ if(!S.me){ toast('Avval tizimga kiring'); return false; } return true; }

const SECTION_META = {
  passenger:{tag:"yo'lovchi", dark:false},
  driver:{tag:"haydovchi", dark:false},
  roadside:{tag:"yo'l & texnika", dark:false},
  profile:{tag:"profil", dark:false},
  admin:{tag:"boshqaruv", dark:true}
};
function setSection(sec){
  WT.tap(); S.section = sec;
  document.querySelectorAll('.nav-item').forEach(b=> b.classList.toggle('active', b.dataset.sec===sec));
  const meta = SECTION_META[sec];
  $('brandTag').textContent = meta.tag;
  $('topbar').classList.toggle('dark', meta.dark);
  $('mapWrap').style.display = meta.dark ? 'none' : 'block';
  $('darkBg').style.display = meta.dark ? 'block' : 'none';
  $('topRight').innerHTML = meta.dark
    ? '<div class="crown-badge"><svg class="ic" viewBox="0 0 24 24"><use href="#i-crown"/></svg>Super Admin</div>'
    : '<div class="avatar"><svg class="ic" viewBox="0 0 24 24"><use href="#i-user"/></svg></div>';
  render();
}
document.querySelectorAll('.nav-item').forEach(b=> b.addEventListener('click', ()=> setSection(b.dataset.sec)));

function render(){
  if(S.section==='passenger') renderPassenger();
  else if(S.section==='driver') renderDriver();
  else if(S.section==='roadside') renderRoadside();
  else if(S.section==='profile') renderProfile();
  else if(S.section==='admin') renderAdmin();
}

function pillTabs(tabs, active, onPick){
  $('pillTabsWrap').innerHTML = '<div class="pill-tabs">' + tabs.map(t=>
    `<div class="ptab ${t.key===active?'active':''}" data-k="${t.key}">${t.label}</div>`
  ).join('') + '</div>';
  $('pillTabsWrap').querySelectorAll('.ptab').forEach(el=> el.addEventListener('click', ()=>{ WT.select(); onPick(el.dataset.k); }));
}
function clearPillTabs(){ $('pillTabsWrap').innerHTML = ''; }
function regionSelectHTML(id, placeholder, opts){
  return `<select class="field-select" id="${id}"><option value="">${placeholder}</option>${(opts||[]).map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select>`;

const PS = {scope:"intercity", service:"passenger", fromR:"", fromD:"", toR:"", toD:"", results:null, dispatch:null, phone:""};
function renderPassenger(){
  clearPillTabs();
  const localRegions = Object.keys(REGIONS).filter(r=>r!=="Toshkent shahri");
  let html = `
    <div class="chip-row">
      <div class="chip ${PS.scope==='intercity'?'active':''}" data-scope="intercity">Viloyatlararo</div>
      <div class="chip ${PS.scope==='local'?'active':''}" data-scope="local">Mahalliy</div>
    </div>
    <div class="chip-row">
      <div class="chip ${PS.service==='passenger'?'active':''}" data-svc="passenger">Yo'lovchi</div>
      <div class="chip ${PS.service==='cargo'?'active':''}" data-svc="cargo">Pochta / Yuk</div>
    </div>
    <div class="route-box">`;
  if(PS.scope==='local'){
    html += `<div class="field-label">Viloyat</div>${regionSelectHTML('fromRegion','Tanlang', localRegions)}
      <div class="field-row" style="margin-top:10px">
        <div>${regionSelectHTML('fromDistrict','Qayerdan', PS.fromR?REGIONS[PS.fromR]:[])}</div>
        <div>${regionSelectHTML('toDistrict','Qayerga', PS.fromR?REGIONS[PS.fromR]:[])}</div>
      </div>`;
  } else {
    html += `<div class="route-inner">
      <div class="route-rail"><div class="dot-a"></div><div class="rail"></div><div class="dot-b"></div></div>
      <div class="route-fields">
        ${regionSelectHTML('fromRegion','Qayerdan (viloyat)', Object.keys(REGIONS))}
        ${PS.fromR && PS.fromR!=="Toshkent shahri" ? regionSelectHTML('fromDistrict','Tuman (ixtiyoriy)', REGIONS[PS.fromR]) : ''}
        <div class="route-sep"></div>
        ${regionSelectHTML('toRegion','Qayerga (viloyat)', Object.keys(REGIONS))}
        ${PS.toR && PS.toR!=="Toshkent shahri" ? regionSelectHTML('toDistrict','Tuman (ixtiyoriy)', REGIONS[PS.toR]) : ''}
      </div>
    </div>`;
  }
  html += `</div>
    <button class="cta" id="searchBtn"><svg class="ic" viewBox="0 0 24 24"><use href="#i-locate"/></svg><span>Haydovchi qidirish</span></button>
    <div id="psgErr"></div>
    <div id="psgResults" style="margin-top:14px"></div>`;
  $('content').innerHTML = html;

  if(PS.scope==='local'){
    $('fromRegion').value = PS.fromR; $('fromDistrict') && ($('fromDistrict').value = PS.fromD); $('toDistrict') && ($('toDistrict').value = PS.toD);
    $('fromRegion').addEventListener('change', e=>{ PS.fromR=e.target.value; PS.toR=e.target.value; PS.fromD=""; PS.toD=""; renderPassenger(); });
    $('fromDistrict') && $('fromDistrict').addEventListener('change', e=>{ PS.fromD=e.target.value; });
    $('toDistrict') && $('toDistrict').addEventListener('change', e=>{ PS.toD=e.target.value; });
  } else {
    $('fromRegion').value = PS.fromR; $('toRegion').value = PS.toR;
    $('fromRegion').addEventListener('change', e=>{ PS.fromR=e.target.value; PS.fromD=""; renderPassenger(); });
    $('toRegion').addEventListener('change', e=>{ PS.toR=e.target.value; PS.toD=""; renderPassenger(); });
    $('fromDistrict') && $('fromDistrict').addEventListener('change', e=> PS.fromD=e.target.value);
    $('toDistrict') && $('toDistrict').addEventListener('change', e=> PS.toD=e.target.value);
  }
  document.querySelectorAll('[data-scope]').forEach(c=> c.addEventListener('click', ()=>{ WT.select(); PS.scope=c.dataset.scope; PS.fromR=PS.fromD=PS.toR=PS.toD=""; PS.results=null; PS.dispatch=null; renderPassenger(); }));
  document.querySelectorAll('[data-svc]').forEach(c=> c.addEventListener('click', ()=>{ WT.select(); PS.service=c.dataset.svc; renderPassenger(); }));
  $('searchBtn').addEventListener('click', passengerSearch);
  renderPassengerResults();
}
function passengerLocs(){
  const fromLoc = PS.scope==='local' ? (PS.fromR&&PS.fromD?`${PS.fromR}, ${PS.fromD}`:"") : (PS.fromR==="Toshkent shahri"?PS.fromR:(PS.fromR&&PS.fromD?`${PS.fromR}, ${PS.fromD}`:PS.fromR));
  const toLoc = PS.scope==='local' ? (PS.toR&&PS.toD?`${PS.toR}, ${PS.toD}`:"") : (PS.toR==="Toshkent shahri"?PS.toR:(PS.toR&&PS.toD?`${PS.toR}, ${PS.toD}`:PS.toR));
  return {fromLoc, toLoc};
}
async function passengerSearch(){
  if(!requireAuth()) return;
  const {fromLoc, toLoc} = passengerLocs();
  if(!fromLoc || !toLoc || fromLoc===toLoc){ $('psgErr').innerHTML = '<div class="err-msg">Manzillarni to\'liq va turlicha tanlang</div>'; return; }
  $('psgErr').innerHTML = '';
  $('searchBtn').innerHTML = '<div class="spinner"></div>';
  try{
    const data = await apiPost('/api/drivers/search', {from_loc:fromLoc, to_loc:toLoc, service_type:PS.service});
    PS.results = data.matches; PS.dispatch = null;
  }catch(e){ $('psgErr').innerHTML = '<div class="err-msg">'+esc(e.message)+'</div>'; }
  renderPassenger();
}
function renderPassengerResults(){
  const box = $('psgResults'); if(!box) return;
  if(PS.results === null){ box.innerHTML=''; return; }
  if(PS.results.length > 0){
    box.innerHTML = '<div class="sec-head"><span class="sec-title">Topilgan haydovchilar</span><span class="sec-action">'+PS.results.length+' ta</span></div>' +
      PS.results.map(d=> `<div class="card-row"><div class="ic-box" style="background:var(--navy-soft);color:var(--navy);font-weight:800;font-size:12px">${esc(initials(d.full_name))}</div><div class="tx"><div class="nm">${esc(d.full_name)}</div><div class="sub">${esc(d.car_model)} · ${esc(d.car_number)}</div></div><div class="side"><div class="num" style="font-size:11px">${esc(d.phone)}</div></div></div>`).join('');
    return;
  }
  if(PS.dispatch){
    box.innerHTML = `<div class="pending-card"><div class="pending-ic"><svg class="ic" viewBox="0 0 24 24"><use href="#i-check"/></svg></div>
      <div class="pending-title">Buyurtmangiz yuborildi</div>
      <div class="pending-desc">${PS.dispatch.notified_now} ta haydovchiga darhol, ${PS.dispatch.notified_later} ta haydovchiga 5 daqiqadan keyin yetkazildi.</div></div>`;
    return;
  }
  box.innerHTML = `<div class="ctrl-card"><div class="ctrl-desc" style="margin:0 0 10px">To'g'ridan-to'g'ri haydovchi topilmadi. Telefon raqamingizni qoldiring — mos haydovchilarga yuboramiz.</div>
    <input class="field-input" id="psgPhone" placeholder="+998 90 123 45 67" value="${esc(PS.phone)}" style="margin-bottom:10px">
    <button class="cta" id="psgOrderBtn"><svg class="ic" viewBox="0 0 24 24"><use href="#i-check"/></svg><span>Yuborish</span></button></div>`;
  $('psgPhone').addEventListener('input', e=> PS.phone = e.target.value);
  $('psgOrderBtn').addEventListener('click', async ()=>{
    if(!PS.phone.trim()){ toast('Telefon raqamingizni kiriting'); return; }
    const {fromLoc, toLoc} = passengerLocs();
    try{
      const data = await apiPost('/api/orders', {from_loc:fromLoc, to_loc:toLoc, service_type:PS.service, phone:PS.phone.trim(), full_name:(S.me&&S.me.first_name)||"Veb foydalanuvchi"});
      PS.dispatch = data; renderPassengerResults();
    }catch(e){ toast(e.message); }
  });
}

function renderDriverRoutes(){

  $('content').innerHTML = `

  function drawForm(){
    const area = $('routeFormArea');

      area.innerHTML = `<div class="field">${regionSelectHTML('locRegion','Viloyat', localRegions)}</div>

      $('fromChips').addEventListener('click', e=>{ const c=e.target.closest('.chip'); if(!c)return; WT.select(); c.classList.toggle('active'); const r=c.dataset.r; fromSel = fromSel.includes(r)?fromSel.filter(x=>x!==r):[...fromSel,r]; updateCount(); });
      $('toChips').addEventListener('click', e=>{ const c=e.target.closest('.chip'); if(!c)return; WT.select(); c.classList.toggle('active'); const r=c.dataset.r; toSel = toSel.includes(r)?toSel.filter(x=>x!==r):[...toSel,r]; updateCount(); });

        catch(e){ toast(e.message); }

    async onConfirm(){ try{ await apiDelete('/api/driver/routes'); S.driverData=null; toast('Tozalandi'); await renderDriver(); }catch(e){ toast(e.message); } }

async function loadRoadside(){
  const box = $('rsResults'); if(!box) return;
  box.innerHTML = '<div class="empty-note">Yuklanmoqda...</div>';
  const apiCat = RS.cat === 'heavy' ? 'heavy' : RS.cat;
  try{
    const coords = await new Promise(res=>{
      if(!navigator.geolocation) return res(null);
      navigator.geolocation.getCurrentPosition(p=>res({lat:p.coords.latitude,lon:p.coords.longitude}), ()=>res(null), {timeout:3000});
    });
    const params = new URLSearchParams({type: apiCat}); if(RS.fuel) params.set('fuel', RS.fuel);
    if(coords){ params.set('lat', coords.lat); params.set('lon', coords.lon); }
    const items = await apiGet('/api/roadside?' + params.toString());
    RS.items = items;
    $('rsCount').textContent = items.length + ' ta';
    box.innerHTML = items.length ? items.map(i=> `<div class="card-row"><div class="ic-box" style="background:var(--navy-soft);color:var(--navy)"><svg class="ic" viewBox="0 0 24 24"><use href="#${SERVICE_TYPES.find(s=>s.key===RS.cat).icon}"/></svg></div><div class="tx"><div class="nm">${esc(i.name)}</div><div class="sub">${esc(i.description||i.phone)}</div></div>${typeof i.distance==='number'?`<div class="side"><div class="num">${i.distance.toFixed(1)}</div><div class="unit">km</div></div>`:''}</div>`).join('') : '<div class="empty-note">Bu filtr bo\'yicha xizmat topilmadi.</div>';
  }catch(e){ box.innerHTML = '<div class="empty-note">'+esc(e.message)+'</div>'; }
}

    try{ await apiPost('/api/admin/ban', {telegram_id:Number(id), reason:$('banReason').value.trim()||undefined, duration_hours: hours||undefined}); toast('Bloklandi'); renderAdminAdmins(); }
    catch(e){ toast(e.message); }
  });
  document.querySelectorAll('[data-unban]').forEach(b=> b.addEventListener('click', async ()=>{ try{ await apiPost('/api/admin/unban', {telegram_id:Number(b.dataset.unban)}); toast('Blokdan chiqarildi'); renderAdminAdmins(); }catch(e){ toast(e.message); } }));
}
async function renderAdminSettings(){
  $('content').innerHTML = '<div class="empty-note">Yuklanmoqda...</div>';
  let card = "8600123456789012";
  try{ const r = await apiGet('/api/admin/settings/card'); card = r.card_number; }catch(e){}
  $('content').innerHTML = `
    <div class="sec-head"><span class="sec-title">To'lov kartasini sozlash</span></div>
    <input class="field-input mono" id="cardNum" value="${esc(card)}" style="margin-bottom:10px">
    <button class="btn-sm ghost" id="saveCardBtn" style="margin-bottom:16px"><svg class="ic" viewBox="0 0 24 24"><use href="#i-card"/></svg><span>Kartani saqlash</span></button>
    <div class="sec-head"><span class="sec-title">Super Admin paroli</span></div>
    <input class="field-input" id="newPass" type="password" placeholder="Yangi parol (kamida 4 belgi)" style="margin-bottom:10px">
    <button class="btn-sm ghost" id="savePassBtn" style="margin-bottom:16px"><svg class="ic" viewBox="0 0 24 24"><use href="#i-key"/></svg><span>Parolni yangilash</span></button>
    <div class="sec-head"><span class="sec-title">Zaxira nusxa</span></div>
    <div class="ctrl-desc" style="margin-top:0">Hozircha bazani zaxiralash faqat bot chatida (💾 Baza tugmasi) mavjud.</div>`;
  $('saveCardBtn').addEventListener('click', async ()=>{
    try{ await apiPost('/api/admin/settings/card', {card_number:$('cardNum').value}); toast('Karta yangilandi'); }catch(e){ toast(e.message); }
  });
  $('savePassBtn').addEventListener('click', async ()=>{
    const p = $('newPass').value;
    try{ await apiPost('/api/admin/settings/password', {new_password:p}); $('newPass').value=''; toast('Parol yangilandi'); }catch(e){ toast(e.message); }
  });
}
