<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F5F7FB">
<title>W-Taxi Production v3.0</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#F5F7FB;color:#0B2A5B;display:flex;justify-content:center;align-items:center;overscroll-behavior:none;user-select:none}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
:root{
  --navy:#0B2A5B;--navy-2:#1A3B7A;--navy-soft:rgba(11,42,91,.10);
  --green:#22A06B;--green-soft:rgba(34,160,107,.12);
  --silver:#A8B2BF;--silver-2:#DDE3EA;--bg:#F5F7FB;
  --ink:#0B2A5B;--muted:#7C8AA0;--hair:rgba(11,42,91,.08);
}
.phone{position:relative;width:100%;max-width:420px;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
@media(min-width:640px){.phone{height:880px;border-radius:44px;box-shadow:0 60px 140px -30px rgba(11,42,91,.28),0 0 0 1px rgba(11,42,91,.06)}}
.map{position:absolute;inset:0;z-index:0}
.map svg.map-svg{width:100%;height:100%;display:block}
.topbar{position:relative;z-index:20;padding:24px 20px 0;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:9px;padding:8px 14px;border-radius:9999px;background:rgba(255,255,255,.94);backdrop-filter:blur(20px);border:1px solid var(--hair);box-shadow:0 4px 16px rgba(11,42,91,.06)}
.brand-txt{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--navy)}
.avatar{width:40px;height:40px;border-radius:9999px;background:rgba(255,255,255,.94);backdrop-filter:blur(20px);border:1px solid var(--hair);box-shadow:0 4px 16px rgba(11,42,91,.06);display:flex;align-items:center;justify-content:center;color:var(--navy);font-weight:700}
.sheet{position:relative;z-index:20;margin-top:auto;background:linear-gradient(180deg,rgba(255,255,255,.95) 0%,rgba(255,255,255,.99) 100%);backdrop-filter:blur(30px);border-top:1px solid var(--hair);border-radius:36px 36px 0 0;padding:12px 20px 20px;box-shadow:0 -20px 60px -20px rgba(11,42,91,.14);max-height:70vh;overflow-y:auto}
.handle{width:40px;height:4px;border-radius:9999px;background:rgba(11,42,91,.12);margin:0 auto 16px}
.pills{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px}
.pill{flex-shrink:0;padding:10px 14px;border-radius:16px;background:#F1F5F9;border:1px solid var(--hair);cursor:pointer;font-family:inherit;font-size:11px;font-weight:700;color:#475569}
.pill.active{background:var(--navy);color:#fff}
.route{position:relative;border-radius:24px;padding:16px;background:#F8FAFC;border:1px solid var(--hair);margin-bottom:16px}
.route-inner{display:flex;gap:12px}
.route-rail{display:flex;flex-direction:column;align-items:center;padding-top:6px}
.dot-a{width:8px;height:8px;border-radius:9999px;background:var(--navy)}
.rail{width:1px;height:28px;margin:4px 0;background:#DDE3EA}
.dot-b{width:8px;height:8px;border-radius:9999px;background:#22A06B}
.route-fields{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.route-fields input{width:100%;background:transparent;border:none;outline:none;color:#0B2A5B;font-size:13px;font-weight:600;font-family:inherit}
.route-sep{height:1px;background:rgba(11,42,91,.08)}
.cta{width:100%;padding:16px;border-radius:16px;background:linear-gradient(135deg,#0B2A5B,#1A3B7A);border:none;color:#fff;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 14px 40px -10px rgba(11,42,91,.5);display:flex;align-items:center;justify-content:center}
.service-list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.service-card{background:#F8FAFC;border:1px solid rgba(11,42,91,.08);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px}
.tabs{position:relative;padding-top:16px;margin-top:16px;border-top:1px solid rgba(11,42,91,.08);display:flex;justify-content:space-around}
.tab{background:none;border:none;cursor:pointer;font-size:10px;font-weight:700;color:#7C8AA0;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:4px}
.tab.active{color:#0B2A5B}
.profile-card{background:#F8FAFC;border:1px solid rgba(11,42,91,.08);border-radius:16px;padding:16px;text-align:center}
.pc-bal{font-size:22px;font-weight:800;color:#0B2A5B;font-family:'JetBrains Mono',monospace;margin:6px 0}
</style>
<link rel="manifest" href="/static/manifest.json">
</head>
<body>
<div class="phone">
  <div class="map"><svg class="map-svg" viewBox="0 0 420 880"><rect width="420" height="880" fill="#EEF2F8"/></svg></div>
  <div class="topbar">
    <div style="font-size:12px;font-weight:800;color:#0B2A5B">W-TAXI PRO v3.0</div>
    <div class="avatar" id="avatarBox">U</div>
  </div>
  <div class="sheet">
    <div class="handle"></div>

    <!-- VIEW 1: ORDER -->
    <div id="view-order">
      <div class="pills">
        <button class="pill active" data-svc="passenger">Taxi</button>
        <button class="pill" data-svc="intercity">Viloyat</button>
        <button class="pill" data-svc="cargo">Yuk / Pochta</button>
      </div>
      <div class="route">
        <div class="route-inner">
          <div class="route-rail"><div class="dot-a"></div><div class="rail"></div><div class="dot-b"></div></div>
          <div class="route-fields">
            <input value="Chilonzor, 19-mavze" id="fromInput" />
            <div class="route-sep"></div>
            <input value="Samarqand, Registon" id="toInput" />
          </div>
        </div>
      </div>
      <button class="cta" id="callBtn">Haydovchilarni qidirish (Real DB)</button>
      <div id="resultsArea" class="service-list"></div>
    </div>

    <!-- VIEW 2: ROADSIDE SERVICES -->
    <div id="view-roadside" style="display:none">
      <div style="font-size:13px;font-weight:800;margin-bottom:10px;color:#0B2A5B">⛽️ Yo‘l bo‘yi xizmatlari markazi</div>
      <div class="pills" id="roadsidePills">
        <button class="pill active" data-type="gas">Zapravka</button>
        <button class="pill" data-type="food">Ovqatlanish</button>
        <button class="pill" data-type="hotel">Mehmonxona</button>
        <button class="pill" data-type="service">Avtoservis</button>
        <button class="pill" data-type="autosalon">Avtosalon</button>
      </div>
      <div id="roadsideArea" class="service-list"></div>
      <div style="margin-top:12px;">
        <button id="showAdFormBtn" style="width:100%;padding:10px;border-radius:12px;background:#F1F5F9;border:1px solid rgba(11,42,91,.08);font-size:11px;font-weight:700;color:#0B2A5B;cursor:pointer;">➕ O'z xizmatingizni qo'shish</button>
      </div>
      <div id="adFormContainer" style="display:none;margin-top:12px;background:#F8FAFC;border:1px solid rgba(11,42,91,.08);border-radius:16px;padding:12px;">
        <div style="font-size:12px;font-weight:800;margin-bottom:8px;color:#0B2A5B">Yangi e'lon joylashtirish</div>
        <select id="adServiceType" style="width:100%;padding:8px;border-radius:8px;border:1px solid #DDE3EA;margin-bottom:8px;font-size:11px;background:#fff;">
          <option value="gas">Zapravka (50,000 so'm)</option>
          <option value="food">Ovqatlanish (50,000 so'm)</option>
          <option value="hotel">Mehmonxona (70,000 so'm)</option>
          <option value="service">Avtoservis (50,000 so'm)</option>
          <option value="autosalon">Avtosalon (100,000 so'm)</option>
        </select>
        <input id="adName" placeholder="Nomi (masalan: Ipak Yo'li Zapravka)" style="width:100%;padding:8px;border-radius:8px;border:1px solid #DDE3EA;margin-bottom:8px;font-size:11px;background:#fff;" />
        <input id="adPhone" placeholder="Telefon raqami (+99890...)" style="width:100%;padding:8px;border-radius:8px;border:1px solid #DDE3EA;margin-bottom:8px;font-size:11px;background:#fff;" />
        <textarea id="adDesc" placeholder="Qisqacha tavsif va qulayliklar..." style="width:100%;padding:8px;border-radius:8px;border:1px solid #DDE3EA;margin-bottom:8px;font-size:11px;background:#fff;height:50px;resize:none;"></textarea>
        <button id="submitAdBtn" style="width:100%;padding:10px;border-radius:10px;background:#22A06B;color:#fff;border:none;font-weight:700;font-size:11px;cursor:pointer;">Tasdiqlash uchun yuborish</button>
      </div>
    
    </div>

    <!-- VIEW 3: PROFILE -->
    <div id="view-profile" style="display:none">
      <div style="font-size:13px;font-weight:800;margin-bottom:12px;color:#0B2A5B">Mening profilim</div>
      <div class="profile-card">
        <div id="pName" style="font-size:13px;font-weight:700;color:#0B2A5B;margin-bottom:2px">Yuklanmoqda...</div>
        <div style="font-size:11px;color:#7C8AA0;margin-bottom:10px" id="pId">Telegram ID</div>
        <div style="font-size:11px;color:#7C8AA0">Balansdagi mablag'</div>
        <div class="pc-bal">124 500 so'm</div>
        <div id="pStatus" style="font-size:11px;color:#22A06B;margin-top:10px;font-weight:700"></div>
      </div>
    </div>

    <!-- TABS -->
    <div class="tabs">
      <button class="tab active" data-target="order">Buyurtma</button>
      <button class="tab" data-target="roadside">Xizmatlar</button>
      <button class="tab" data-target="profile">Profil</button>
    </div>
  </div>
</div>

<script src="/static/telegram.js"></script>
<script>
(function(){
  'use strict';
  WT.init();
  const $ = id => document.getElementById(id);

  async function loadMe() {
    const initData = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp.initData : '';
    try {
      const res = await fetch('/api/me', {headers: {'X-Init-Data': initData}});
      if(res.ok) {
        const data = await res.json();
        $('pName').textContent = data.first_name || 'Foydalanuvchi';
        $('pId').textContent = 'ID: ' + data.id;
        $('avatarBox').textContent = (data.first_name || 'U')[0].toUpperCase();
        $('pStatus').textContent = data.has_driver_profile ? '🚗 Haydovchi' : '🙋‍♂️ Mijoz';
      }
    } catch(e) { $('pName').textContent = 'Foydalanuvchi'; }
  }
  loadMe();

  let currentService = 'passenger';
  document.querySelectorAll('#view-order .pill').forEach(p=>{
    p.addEventListener('click', ()=>{
      document.querySelectorAll('#view-order .pill').forEach(x=>x.classList.remove('active'));
      p.classList.add('active');
      currentService = p.dataset.svc;
    });
  });

  $('callBtn').addEventListener('click', async ()=>{
    const area = $('resultsArea');
    area.innerHTML = '<div style="text-align:center;padding:12px;color:#7C8AA0;font-size:11px">Bazadan haydovchilar izlanmoqda...</div>';
    const initData = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp.initData : '';
    try {
      const res = await fetch('/api/drivers/search', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'X-Init-Data': initData},
        body: JSON.stringify({from_loc: $('fromInput').value, to_loc: $('toInput').value, service_type: currentService})
      });
      const data = await res.json();
      if(data.matches && data.matches.length > 0) {
        area.innerHTML = '';
        data.matches.forEach(drv=>{
          const card = document.createElement('div');
          card.className = 'service-card';
          card.innerHTML = `<div style="font-weight:700;font-size:12px">${drv.full_name}</div><div style="font-size:10px;color:#7C8AA0">${drv.car_model} · ${drv.car_number} | 📞 ${drv.phone || 'Yoʻq'}</div>`;
          area.appendChild(card);
        });
      } else {
        area.innerHTML = '<div style="text-align:center;padding:12px;color:#7C8AA0;font-size:11px">Haydovchi topilmadi, buyurtmangiz bazaga yozildi!</div>';
        await fetch('/api/orders', {
          method: 'POST',
          headers: {'Content-Type': 'application/json', 'X-Init-Data': initData},
          body: JSON.stringify({from_loc: $('fromInput').value, to_loc: $('toInput').value, service_type: currentService, full_name: $('pName').textContent, phone: '+998901234567'})
        });
      }
    } catch(e) { area.innerHTML = '<div style="text-align:center;padding:12px;color:red;font-size:11px">Xatolik!</div>'; }
  });

  let currentRoadsideType = 'gas';
  async function loadRoadside(type) {
    currentRoadsideType = type;
    const area = $('roadsideArea');
    area.innerHTML = '<div style="text-align:center;padding:12px;color:#7C8AA0;font-size:11px">Yuklanmoqda...</div>';
    try {
      const res = await fetch(`/api/roadside?type=${type}&lat=41.3111&lon=69.2797`);
      const items = await res.json();
      if(items && items.length > 0) {
        area.innerHTML = '';
        items.forEach(item=>{
          const card = document.createElement('div');
          card.className = 'service-card';
          card.innerHTML = `
            <div style="font-weight:700;font-size:12px;color:#0B2A5B">${item.name}</div>
            <div style="font-size:10px;color:#7C8AA0">${item.description || ''}</div>
            <div style="font-size:10px;color:#0B2A5B;font-family:'JetBrains Mono',monospace">📞 ${item.phone || 'Yoʻq'} | 📍 ${(item.distance || 0).toFixed(1)} km</div>
          `;
          area.appendChild(card);
        });
      } else {
        area.innerHTML = '<div style="text-align:center;padding:12px;color:#7C8AA0;font-size:11px">Bu turdagi xizmatlar topilmadi.</div>';
      }
    } catch(e) { area.innerHTML = '<div style="text-align:center;padding:12px;color:red;font-size:11px">Xatolik!</div>'; }
  }

  document.querySelectorAll('#roadsidePills .pill').forEach(p=>{
    p.addEventListener('click', ()=>{
      document.querySelectorAll('#roadsidePills .pill').forEach(x=>x.classList.remove('active'));
      p.classList.add('active');
      loadRoadside(p.dataset.type);
    });
  });

  const views = {order:$('view-order'), roadside:$('view-roadside'), profile:$('view-profile')};
  document.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click', ()=>{
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      const target = t.dataset.target;
      Object.keys(views).forEach(k=> views[k].style.display = (k === target)?'block':'none');
      if(target === 'roadside') loadRoadside(currentRoadsideType);
    });
  });

      const showAdBtn = document.getElementById("showAdFormBtn");
      const adForm = document.getElementById("adFormContainer");
      if(showAdBtn && adForm) {
        showAdBtn.addEventListener("click", () => {
          adForm.style.display = adForm.style.display === "none" ? "block" : "none";
        });
      }

      const submitAdBtn = document.getElementById("submitAdBtn");
      if(submitAdBtn) {
        submitAdBtn.addEventListener("click", async () => {
          const type = document.getElementById("adServiceType").value;
          const name = document.getElementById("adName").value;
          const phone = document.getElementById("adPhone").value;
          const desc = document.getElementById("adDesc").value;

          if(!name || !phone) {
            alert("Iltimos, nom va telefon raqamini kiriting!");
            return;
          }

          const initData = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp.initData : "";
          try {
            const res = await fetch("/api/ads", {
              method: "POST",
              headers: {"Content-Type": "application/json", "X-Init-Data": initData},
              body: JSON.stringify({
                service_type: type,
                name: name,
                phone: phone,
                description: desc,
                latitude: 41.3111,
                longitude: 69.2797,
                fuel_types: "AI-92, Metan"
              })
            });
            const data = await res.json();
            if(res.ok) {
              alert("✅ E'loningiz muvaffaqiyatli qabul qilindi va adminga yuborildi!");
              adForm.style.display = "none";
            } else {
              alert("❌ Xatolik: " + (data.error || "Noma'lum"));
            }
          } catch(e) {
            alert("Server bilan aloqada xatolik!");
          }
        });
      }
    
})();
</script>
</body>
</html>
