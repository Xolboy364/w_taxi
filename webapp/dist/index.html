<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#F5F7FB">
<title>W-Taxi</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#F5F7FB;color:#0B2A5B;display:flex;justify-content:center;align-items:center;overscroll-behavior:none;user-select:none}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
:root{--navy:#0B2A5B;--navy-2:#1A3B7A;--navy-soft:rgba(11,42,91,.10);--green:#22A06B;--green-soft:rgba(34,160,107,.12);--silver:#A8B2BF;--silver-2:#DDE3EA;--bg:#F5F7FB;--ink:#0B2A5B;--muted:#7C8AA0;--hair:rgba(11,42,91,.08);--red:#DC2626;--amber:#D97706}
.phone{position:relative;width:100%;max-width:420px;height:100dvh;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
@media(min-width:640px){.phone{height:880px;border-radius:44px;box-shadow:0 60px 140px -30px rgba(11,42,91,.28),0 0 0 1px rgba(11,42,91,.06)}}
.ic{display:inline-block;flex-shrink:0;width:1em;height:1em;color:currentColor;vertical-align:middle}
.ic use{pointer-events:none}
.map{position:absolute;inset:0;z-index:0}
.map svg.map-svg{width:100%;height:100%;display:block}
.glow{position:absolute;border-radius:9999px;filter:blur(100px);pointer-events:none}
.glow-a{top:30%;left:20%;width:280px;height:280px;background:var(--navy);opacity:.07}
.glow-b{bottom:25%;right:15%;width:320px;height:320px;background:var(--green);opacity:.06}
.map-ctrl{position:absolute;z-index:15;right:14px;bottom:340px;display:flex;flex-direction:column;gap:8px}
.map-btn{width:40px;height:40px;border-radius:14px;background:rgba(255,255,255,.96);border:1px solid var(--hair);box-shadow:0 4px 16px rgba(11,42,91,.1);display:flex;align-items:center;justify-content:center;color:var(--navy);cursor:pointer;transition:transform .15s}
.map-btn:active{transform:scale(.9)}
.map-btn .ic{width:18px;height:18px}
.map-btn.small{width:36px;height:36px;border-radius:12px}
.map-btn.small .ic{width:15px;height:15px}
.street-label{font-family:'Plus Jakarta Sans',sans-serif;font-size:6.5px;font-weight:600;fill:#9AA7B8;letter-spacing:.08em;text-transform:uppercase;paint-order:stroke;stroke:#fff;stroke-width:1.5px;stroke-linejoin:round}
.block-label{font-family:'Plus Jakarta Sans',sans-serif;font-size:5px;font-weight:700;fill:#B8C2D0;text-anchor:middle}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes sheetIn{from{transform:translateY(120px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes pulseRing{0%{transform:scale(1);opacity:.8}100%{transform:scale(18);opacity:0}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes drawLine{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}
@keyframes popIn{from{transform:scale(0) rotate(-90deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
@keyframes sweep{0%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@keyframes treeShimmer{0%,100%{opacity:.85}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
.fade-up{animation:fadeUp .34s cubic-bezier(.22,.61,.36,1) both}
.sheet-in{animation:sheetIn .7s cubic-bezier(.22,.61,.36,1) both}
.pop{animation:popIn .5s cubic-bezier(.34,1.56,.64,1) both}
.blink{animation:blink 1.6s ease-in-out infinite}
.sweep{animation:sweep 2.6s ease-in-out infinite}
.shimmer{background:linear-gradient(90deg,#E5EAF1 0%,#F1F5FA 50%,#E5EAF1 100%);background-size:200% 100%;animation:shimmer 1.4s infinite}
.draw{stroke-dasharray:300;stroke-dashoffset:300;animation:drawLine 1.3s cubic-bezier(.65,0,.35,1) forwards}
.ripple,.ripple2,.ripple3{transform-origin:120px 560px;animation:pulseRing 2.2s ease-out infinite}
.ripple2{animation-delay:.7s}.ripple3{animation-delay:1.4s}
.tree-grp{animation:treeShimmer 4s ease-in-out infinite}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
.topbar{position:relative;z-index:20;padding:24px 20px 0;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:9px;padding:8px 14px;border-radius:9999px;background:rgba(255,255,255,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--hair);box-shadow:0 4px 16px rgba(11,42,91,.06)}
.brand-w{width:18px;height:18px;color:var(--navy)}
.brand-txt{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--navy)}
.brand-txt .dash{color:var(--silver);margin:0 1px;font-weight:600}
.brand-ver{font-size:10px;color:var(--silver);font-family:'JetBrains Mono',monospace}
.avatar{width:40px;height:40px;border-radius:9999px;background:rgba(255,255,255,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--hair);box-shadow:0 4px 16px rgba(11,42,91,.06);display:flex;align-items:center;justify-content:center;color:var(--navy);transition:transform .15s;overflow:hidden;position:relative}
.avatar:active{transform:scale(.9)}
.avatar .ic{width:18px;height:18px}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:9999px}
.sheet{position:relative;z-index:20;margin-top:auto;background:linear-gradient(180deg,rgba(255,255,255,.95) 0%,rgba(255,255,255,.99) 100%);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-top:1px solid var(--hair);border-radius:36px 36px 0 0;padding:12px 20px 20px;box-shadow:0 -20px 60px -20px rgba(11,42,91,.14);max-height:80vh;overflow-y:auto}
.handle{width:40px;height:4px;border-radius:9999px;background:rgba(11,42,91,.12);margin:0 auto 16px}
.pills{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px}
.pills::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;padding:10px 14px;border-radius:16px;background:#F1F5F9;border:1px solid var(--hair);display:flex;align-items:center;gap:9px;cursor:pointer;transition:all .25s;font-family:inherit}
.pill.active{background:linear-gradient(135deg,rgba(11,42,91,.10),rgba(11,42,91,.04));border-color:rgba(11,42,91,.28)}
.pill:active{transform:scale(.96)}
.pill-ic{width:22px;height:22px;color:var(--silver);transition:color .25s;display:flex;align-items:center;justify-content:center}
.pill.active .pill-ic{color:var(--navy)}
.pill-ic .ic{width:100%;height:100%}
.pill-label{font-size:11px;font-weight:700;line-height:1;color:#475569;text-align:left;transition:color .25s}
.pill.active .pill-label{color:var(--navy)}
.pill-sub{font-size:9px;color:var(--silver);margin-top:4px;line-height:1;font-family:'JetBrains Mono',monospace;text-align:left;display:block}
.pill.active .pill-sub{color:var(--navy-2)}
.route{position:relative;border-radius:24px;padding:16px;background:#F8FAFC;border:1px solid var(--hair);margin-bottom:16px;overflow:hidden}
.route::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;background:radial-gradient(circle at 20% 0%,rgba(11,42,91,.07),transparent 60%)}
.route-inner{position:relative;display:flex;gap:12px}
.route-rail{display:flex;flex-direction:column;align-items:center;padding-top:6px}
.dot-a{width:8px;height:8px;border-radius:9999px;background:var(--navy);box-shadow:0 0 0 3px var(--navy-soft)}
.rail{width:1px;height:28px;margin:4px 0;background:linear-gradient(180deg,rgba(11,42,91,.4),rgba(34,160,107,.4))}
.dot-b{width:8px;height:8px;border-radius:9999px;background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.route-fields{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
.route-fields input{width:100%;background:transparent;border:none;outline:none;color:var(--ink);font-size:13px;font-weight:600;font-family:inherit;user-select:text}
.route-fields input::placeholder{color:var(--silver)}
.route-sep{height:1px;background:var(--hair)}
.route-foot{position:relative;margin-top:12px;padding-top:12px;border-top:1px solid var(--hair);display:flex;align-items:center;justify-content:space-between;font-size:10px}
.route-stats{display:flex;align-items:center;gap:12px;color:var(--silver)}
.route-stats .sep{width:4px;height:4px;border-radius:9999px;background:#CBD5E1}
.route-price{color:var(--muted);font-weight:700}
.route-price .num{color:var(--ink)}
.cta{position:relative;width:100%;padding:16px;border-radius:16px;background:linear-gradient(135deg,var(--navy) 0%,var(--navy-2) 100%);border:none;color:#fff;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;overflow:hidden;transition:transform .12s;box-shadow:0 14px 40px -10px rgba(11,42,91,.5);display:flex;align-items:center;justify-content:center;gap:9px}
.cta:active{transform:scale(.975)}
.cta:disabled{opacity:.6;cursor:not-allowed}
.cta span{position:relative;z-index:2}
.cta .ic{width:17px;height:17px;position:relative;z-index:2}
.cta:not(:disabled)::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);animation:sweep 2.6s ease-in-out infinite}
.cta.green{background:linear-gradient(135deg,var(--green) 0%,#15803D 100%);box-shadow:0 14px 40px -10px rgba(34,160,107,.5)}
.cta.ghost{background:#F1F5F9;color:var(--muted);box-shadow:none;border:1px solid var(--hair)}
.cta.ghost::after{display:none}
.cta.ghost:active{transform:scale(.97)}
.search-row{display:flex;align-items:center;gap:16px;padding:8px 0}
.search-pulse{position:relative;width:48px;height:48px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.search-core{width:12px;height:12px;border-radius:9999px;background:var(--navy);animation:blink 1.4s ease-in-out infinite}
.search-ring{position:absolute;width:8px;height:8px;border-radius:9999px;border:1.5px solid var(--navy);animation:pulseRing 2.2s ease-out infinite}
.search-ring:nth-child(2){animation-delay:.7s}
.search-title{font-size:13px;font-weight:700;color:var(--ink)}
.search-sub{font-size:11px;color:var(--muted);margin-top:2px}
.skels{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.skel{height:8px;border-radius:9999px}
.section-title{font-size:13px;font-weight:800;color:var(--ink);margin-bottom:12px}
.status-row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.status-dot{width:6px;height:6px;border-radius:9999px;background:var(--green);animation:blink 1.6s ease-in-out infinite}
.status-txt{font-size:10px;font-weight:800;letter-spacing:.06em;color:var(--green);text-transform:uppercase}
.driver-card{border-radius:24px;padding:16px;margin-bottom:12px;position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(11,42,91,.08),rgba(11,42,91,.02));border:1px solid rgba(11,42,91,.18)}
.driver-row{display:flex;align-items:center;gap:12px}
.driver-av{position:relative;flex-shrink:0;width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,var(--navy),var(--navy-2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:800;overflow:hidden}
.driver-av img{width:100%;height:100%;object-fit:cover;border-radius:16px}
.driver-badge{position:absolute;bottom:-2px;right:-2px;width:16px;height:16px;border-radius:9999px;background:var(--green);border:2px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff}
.driver-badge .ic{width:8px;height:8px}
.driver-info{flex:1;min-width:0}
.driver-name{font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.driver-car{font-size:10px;color:var(--navy-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.driver-meta{display:flex;align-items:center;gap:8px;margin-top:6px}
.driver-meta .star{font-size:10px;color:#E8A500;display:flex;align-items:center;gap:3px;font-weight:700}
.driver-meta .star .ic{width:9px;height:9px}
.driver-meta .sep{width:4px;height:4px;border-radius:9999px;background:#CBD5E1}
.driver-meta .trips{font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.driver-eta{text-align:right;flex-shrink:0}
.eta-label{font-size:9px;color:var(--silver);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.eta-num{font-size:24px;font-weight:800;line-height:1;margin-top:4px;color:var(--navy);font-family:'JetBrains Mono',monospace}
.eta-unit{font-size:11px;color:var(--muted);font-weight:700;margin-left:2px}
.driver-actions{display:flex;gap:8px;margin-top:12px}
.driver-actions button{flex:1;padding:10px;border-radius:12px;background:#fff;border:1px solid var(--hair);color:var(--ink);font-size:11px;font-weight:700;font-family:inherit;cursor:pointer;transition:transform .12s;display:flex;align-items:center;justify-content:center;gap:6px}
.driver-actions button:active{transform:scale(.95)}
.driver-actions button .ic{width:13px;height:13px;color:var(--navy-2)}
.vip-badge{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:800;color:#B45309;background:linear-gradient(135deg,#FEF3C7,#FDE68A);padding:2px 6px;border-radius:6px;margin-bottom:4px}
.empty-state{text-align:center;padding:20px 8px;color:var(--muted);font-size:12px}
.empty-state .big{font-size:32px;margin-bottom:8px}
.form-row{margin-bottom:10px}
.form-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;display:block}
.form-input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--hair);background:#F8FAFC;font-size:13px;outline:none;color:var(--ink);font-family:inherit;transition:border .15s}
.form-input:focus{border-color:var(--navy-2);background:#fff}
.banner{padding:10px 12px;border-radius:12px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px;margin-bottom:12px}
.banner.warn{background:rgba(217,119,6,.12);border:1px solid rgba(217,119,6,.35);color:#92400E}
.banner.err{background:rgba(220,38,38,.12);border:1px solid rgba(220,38,38,.35);color:#991B1B}
.banner.info{background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.35);color:#1E40AF}
.rating{text-align:center;padding:8px 0}
.rating-emoji{width:56px;height:56px;border-radius:9999px;margin:0 auto 12px;background:linear-gradient(135deg,var(--green-soft),rgba(34,160,107,.04));border:1px solid rgba(34,160,107,.3);display:flex;align-items:center;justify-content:center;color:var(--green)}
.rating-emoji .ic{width:26px;height:26px}
.rating-title{font-size:14px;font-weight:800;color:var(--ink)}
.rating-sub{font-size:11px;color:var(--muted);margin-top:4px}
.stars{display:flex;justify-content:center;gap:12px;margin:16px 0}
.stars button{background:transparent;border:none;cursor:pointer;padding:0;transition:transform .15s;color:#DDE3EA;display:flex}
.stars button .ic{width:26px;height:26px}
.stars button.on{color:#E8A500}
.stars button:active{transform:scale(1.3)}
.tabs{position:relative;padding-top:16px;margin-top:16px;border-top:1px solid var(--hair)}
.tab-indicator{position:absolute;top:0;height:1px;pointer-events:none;transition:left .3s cubic-bezier(.22,.61,.36,1)}
.tab-indicator::before{content:"";position:absolute;top:-3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:9999px;background:var(--navy)}
.tabs-row{display:flex;justify-content:space-around;align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;gap:5px;padding:4px 20px;background:transparent;border:none;cursor:pointer;font-family:inherit}
.tab .ic-o,.tab .ic-f{width:18px;height:18px;transition:opacity .25s;position:absolute}
.tab .ic-f{opacity:0}
.tab.active .ic-f{opacity:1}
.tab.active .ic-o{opacity:0}
.tab-ic-wrap{position:relative;width:18px;height:18px;display:flex;align-items:center;justify-content:center}
.tab .ic-o{color:var(--silver)}
.tab .ic-f{color:var(--navy)}
.tab-label{font-size:10px;font-weight:700;transition:color .3s}
.tab.active .tab-label{color:var(--ink)}
.tab:not(.active) .tab-label{color:var(--silver)}
.history-item{background:#F8FAFC;border:1px solid var(--hair);border-radius:14px;padding:12px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.hi-left{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.hi-route{font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hi-date{font-size:10px;color:var(--silver);font-family:'JetBrains Mono',monospace}
.hi-status{font-size:9px;color:var(--green);font-weight:700;text-transform:uppercase;margin-top:2px}
.hi-status.closed{color:var(--silver)}
.profile-card{background:#F8FAFC;border:1px solid var(--hair);border-radius:16px;padding:16px;text-align:center}
.pc-bal{font-size:24px;font-weight:800;color:var(--navy);font-family:'JetBrains Mono',monospace;margin:6px 0}
.pc-row{display:flex;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--hair);font-size:11px;color:var(--muted)}
.pc-row span:last-child{font-weight:700;color:var(--ink);font-family:'JetBrains Mono',monospace}
.tg-badge{position:fixed;bottom:8px;left:8px;z-index:100;font-size:9px;font-family:'JetBrains Mono',monospace;color:var(--silver);background:rgba(255,255,255,.6);padding:3px 7px;border-radius:6px;opacity:.7;pointer-events:none}
</style>
</head>

<script>
(function(){
'use strict';

// ═══════════════ TELEGRAM + API WRAPPER ═══════════════
const tg = window.Telegram && window.Telegram.WebApp;
const IS_TG = !!(tg && tg.initData);

const WT = {
  isTelegram: IS_TG,
  user: null,
  initData: IS_TG ? tg.initData : '',
  init() {
    if (!IS_TG) return this;
    try {
      tg.ready(); tg.expand();
      tg.disableVerticalSwipes && tg.disableVerticalSwipes();
      tg.setHeaderColor && tg.setHeaderColor('secondary_bg_color');
      tg.enableClosingConfirmation && tg.enableClosingConfirmation();
      const u = tg.initDataUnsafe && tg.initDataUnsafe.user;
      if (u) this.user = { id: u.id, name: ((u.first_name||'')+' '+(u.last_name||'')).trim(), photo: u.photo_url||null, username: u.username||null };
    } catch(e){ console.warn('[WT]', e); }
    return this;
  },
  tap(){ IS_TG && tg.HapticFeedback && tg.HapticFeedback.impactOccurred('light'); },
  success(){ IS_TG && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success'); },
  warn(){ IS_TG && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('warning'); },
  error(){ IS_TG && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('error'); },
  alert(m){ IS_TG ? tg.showAlert(m) : alert(m); }
};

// ═══════════════ API HELPER ═══════════════
async function api(path, options) {
  options = options || {};
  const headers = Object.assign({
    'Content-Type': 'application/json'
  }, options.headers || {});
  if (WT.initData) headers['X-Init-Data'] = WT.initData;
  const token = localStorage.getItem('wtaxi_session');
  if (token) headers['X-Session-Token'] = token;

  let res;
  try {
    res = await fetch('/api' + path, Object.assign({}, options, { headers }));
  } catch(e) {
    throw new Error('Tarmoqda xatolik. Internetni tekshiring.');
  }

  let data = null;
  const txt = await res.text();
  try { data = txt ? JSON.parse(txt) : null; } catch(e) { data = { raw: txt }; }

  if (!res.ok) {
    const err = new Error((data && (data.error || data.reason)) || ('HTTP ' + res.status));
    err.status = res.status;
    err.data = data;
    throw err;
  }
  return data;
}

// ═══════════════ STATE ═══════════════
const STATE = {
  service: 'taxi',
  from: '',
  to: '',
  tab: 'order',
  drivers: [],
  lastSearch: null
};

const $ = id => document.getElementById(id);
const states = {
  loading: $('state-loading'),
  idle: $('state-idle'),
  searching: $('state-searching'),
  drivers: $('state-drivers'),
  order: $('state-order'),
  success: $('state-success'),
  history: $('state-history'),
  profile: $('state-profile')
};

function showState(name) {
  Object.keys(states).forEach(k => {
    states[k].style.display = (k === name) ? 'block' : 'none';
    if (k === name) {
      states[k].classList.remove('fade-up');
      void states[k].offsetWidth;
      states[k].classList.add('fade-up');
    }
  });
}

// ═══════════════ INIT ═══════════════
WT.init();
const badge = $('tgBadge');
if (WT.isTelegram) {
  badge.textContent = 'telegram ✓ ' + (WT.user ? WT.user.name.split(' ')[0] : '');
  if (WT.user && WT.user.photo) {
    $('avatarBtn').innerHTML = '<img src="' + WT.user.photo + '" alt="">';
  }
}

// ═══════════════ TABS ═══════════════
const tabOrder = ['order', 'history', 'profile'];
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    WT.tap();
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    const idx = tabOrder.indexOf(t.dataset.tab);
    $('tabIndicator').style.left = (idx * 33.333) + '%';
    STATE.tab = t.dataset.tab;

    if (STATE.tab === 'order') {
      showState('idle');
    } else if (STATE.tab === 'history') {
      loadHistory();
    } else if (STATE.tab === 'profile') {
      loadProfile();
    }
  });
});

// ═══════════════ SERVICE PILLS ═══════════════
document.querySelectorAll('.pill').forEach(p => {
  p.addEventListener('click', () => {
    WT.tap();
    document.querySelectorAll('.pill').forEach(x => x.classList.remove('active'));
    p.classList.add('active');
    STATE.service = p.dataset.svc === 'taxi' ? 'passenger' : (p.dataset.svc === 'yuk' ? 'cargo' : 'passenger');
    // placeholder yangilash
    const from = $('fromInput'), to = $('toInput');
    if (p.dataset.svc === 'taxi') { from.placeholder = 'Qayerdan...'; to.placeholder = 'Qayerga...'; }
    else if (p.dataset.svc === 'viloyat') { from.placeholder = 'Viloyat / shahar'; to.placeholder = 'Manzil'; }
    else { from.placeholder = 'Yuboruvchi manzili'; to.placeholder = 'Oluvchi manzili'; }
  });
});

// ═══════════════ SEARCH FLOW ═══════════════
$('callBtn').addEventListener('click', async () => {
  WT.tap();
  const from = $('fromInput').value.trim();
  const to = $('toInput').value.trim();
  if (!from || !to) {
    WT.alert('Manzillarni kiriting');
    WT.error();
    return;
  }
  STATE.from = from;
  STATE.to = to;

  showState('searching');
  $('searchSub').textContent = 'Serverda qidirilmoqda...';

  try {
    const res = await api('/drivers/search', {
      method: 'POST',
      body: JSON.stringify({ from_loc: from, to_loc: to, service_type: STATE.service })
    });
    const matches = (res && res.matches) || [];
    STATE.drivers = matches;

    if (matches.length > 0) {
      renderDrivers(matches);
      showState('drivers');
      WT.success();
    } else {
      // Haydovchi yo'q → buyurtma berish
      openOrderForm();
      WT.warn();
    }
  } catch(e) {
    if (e.status === 401) {
      showState('idle');
      WT.alert('Iltimos, bot orqali qayta oching (avtorizatsiya kerak).');
    } else if (e.status === 403 && e.data && e.data.reason) {
      showState('idle');
      WT.alert('Sizning profilingiz bloklangan: ' + e.data.reason);
    } else {
      showState('idle');
      WT.alert(e.message || 'Xatolik yuz berdi');
    }
    WT.error();
  }
});

function renderDrivers(list) {
  const wrap = $('driversList');
  wrap.innerHTML = '';
  $('driversTitle').textContent = 'Topilgan haydovchilar (' + list.length + ')';
  list.forEach(d => {
    const initial = (d.full_name || 'H')[0].toUpperCase();
    const card = document.createElement('div');
    card.className = 'driver-card';
    card.innerHTML =
      '<div class="driver-row">' +
        '<div class="driver-av">' + initial + '<div class="driver-badge"><svg class="ic" viewBox="0 0 24 24"><use href="#i-check"/></svg></div></div>' +
        '<div class="driver-info">' +
          '<div class="driver-name">' + escapeHtml(d.full_name || 'Haydovchi') + '</div>' +
          '<div class="driver-car">' + escapeHtml((d.car_model || '') + ' · ' + (d.car_number || '')) + '</div>' +
          '<div class="driver-meta">' +
            '<span class="star"><svg class="ic" viewBox="0 0 24 24"><use href="#i-star"/></svg> ' + escapeHtml(d.car_model || '—') + '</span>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="driver-actions">' +
        '<button data-call="' + escapeHtml(d.phone || '') + '"><svg class="ic" viewBox="0 0 24 24"><use href="#i-phone"/></svg>Qo\'ng\'iroq</button>' +
        '<button data-order="1"><svg class="ic" viewBox="0 0 24 24"><use href="#i-chat"/></svg>Buyurtma</button>' +
      '</div>';
    card.querySelector('[data-call]').addEventListener('click', (ev) => {
      WT.tap();
      const phone = ev.currentTarget.getAttribute('data-call');
      if (phone) window.location.href = 'tel:' + phone;
    });
    card.querySelector('[data-order]').addEventListener('click', () => {
      WT.tap();
      openOrderForm();
    });
    wrap.appendChild(card);
  });
}

// ═══════════════ ORDER FLOW ═══════════════
function openOrderForm() {
  $('orderBanner').innerHTML =
    '<div class="banner info">📍 ' + escapeHtml(STATE.from) + ' → ' + escapeHtml(STATE.to) + '</div>';
  const saved = localStorage.getItem('wtaxi_phone');
  if (saved) $('orderPhone').value = saved;
  showState('order');
}

$('cancelOrderBtn').addEventListener('click', () => {
  WT.tap();
  showState('idle');
});

$('submitOrderBtn').addEventListener('click', async () => {
  WT.tap();
  const phone = $('orderPhone').value.trim();
  if (!/^\+?\d{9,15}$/.test(phone.replace(/\s/g, ''))) {
    WT.alert('Telefon raqamni to\'g\'ri kiriting');
    WT.error();
    return;
  }

  const btn = $('submitOrderBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span><span>Yuborilmoqda...</span>';

  try {
    const res = await api('/orders', {
      method: 'POST',
      body: JSON.stringify({
        from_loc: STATE.from,
        to_loc: STATE.to,
        service_type: STATE.service,
        phone: phone,
        full_name: WT.user ? WT.user.name : 'Veb foydalanuvchi'
      })
    });
    localStorage.setItem('wtaxi_phone', phone);
    $('successSub').textContent =
      'Yo\'nalish: ' + STATE.from + ' → ' + STATE.to +
      '\nHaydovchilarga yuborildi: ' + (res.notified_now || 0) +
      ((res.notified_later > 0) ? (' (+' + res.notified_later + ' keyinroq)') : '');
    showState('success');
    WT.success();
  } catch(e) {
    if (e.status === 429) {
      WT.alert('Juda ko\'p buyurtma. 1 soatdan keyin qayta urinib ko\'ring.');
    } else if (e.status === 401) {
      WT.alert('Avtorizatsiya kerak. Bot orqali qayta oching.');
    } else {
      WT.alert(e.message || 'Buyurtma yuborilmadi');
    }
    WT.error();
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<svg class="ic" viewBox="0 0 24 24"><use href="#i-check"/></svg><span>Buyurtmani yuborish</span>';
  }
});

$('successDoneBtn').addEventListener('click', () => {
  WT.tap();
  showState('idle');
  $('fromInput').value = '';
  $('toInput').value = '';
});

// ═══════════════ HISTORY ═══════════════
async function loadHistory() {
  const wrap = $('historyList');
  wrap.innerHTML = '<div class="skel shimmer" style="height:60px;margin-bottom:8px"></div><div class="skel shimmer" style="height:60px"></div>';
  try {
    const list = await api('/history');
    if (!list || list.length === 0) {
      wrap.innerHTML = '<div class="empty-state"><div class="big">📭</div>Hozircha safarlar yo\'q</div>';
      return;
    }
    wrap.innerHTML = '';
    list.forEach(o => {
      const st = o.is_active ? 'Aktiv' : 'Yakunlangan';
      const stClass = o.is_active ? '' : 'closed';
      const el = document.createElement('div');
      el.className = 'history-item';
      el.innerHTML =
        '<div class="hi-left">' +
          '<div class="hi-route">' + escapeHtml(o.from_loc || '?') + ' → ' + escapeHtml(o.to_loc || '?') + '</div>' +
          '<div class="hi-date">' + escapeHtml(o.created_at_str || '') + '</div>' +
          '<div class="hi-status ' + stClass + '">' + st + '</div>' +
        '</div>';
      wrap.appendChild(el);
    });
  } catch(e) {
    wrap.innerHTML = '<div class="empty-state"><div class="big">⚠️</div>' + escapeHtml(e.message || 'Xatolik') + '</div>';
  }
}
$('refreshHistoryBtn').addEventListener('click', () => { WT.tap(); loadHistory(); });

// ═══════════════ PROFILE ═══════════════
async function loadProfile() {
  try {
    const p = await api('/profile');
    $('profileName').textContent = WT.user ? WT.user.name : ('Foydalanuvchi #' + p.user_id);
    $('profileId').textContent = 'ID: ' + p.user_id;
    $('profileBalance').textContent = (p.balance || 0).toLocaleString('uz-UZ') + " so'm";
    $('profileDriver').textContent = p.driver ? 'Ha' : "Yo'q";
    $('profileSub').textContent = p.driver ? (p.is_subscribed ? 'Faol ✓' : 'Yo\'q') : '—';
    $('profileRoutes').textContent = p.routes_count || 0;
  } catch(e) {
    $('profileName').textContent = 'Xatolik';
  }
}

// ═══════════════ MAP CONTROLS ═══════════════
$('btnLocate').addEventListener('click', () => WT.tap());
$('btnLayers').addEventListener('click', () => { WT.tap(); WT.alert('Qatlamlar: Standart · Sun\'iy · Transport'); });
$('btnZoomIn').addEventListener('click', () => WT.tap());
$('btnZoomOut').addEventListener('click', () => WT.tap());

// ═══════════════ UTILS ═══════════════
function escapeHtml(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// ═══════════════ BOOT ═══════════════
(async function boot(){
  await new Promise(r => setTimeout(r, 400));
  showState('idle');
})();

})();
</script>
</body>
</html>
